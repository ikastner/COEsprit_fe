    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompDeclaration*/
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompFunction*/
        	listeTermes() {
        		var ids = this.termeIds;
        		if (typeof ids === "string") {
        			try { ids = JSON.parse(ids); } catch (e) { ids = String(ids).split(","); }
        		}
        		if (!Array.isArray(ids)) ids = [];
        		var termes = this.termes || [];
        		var out = [];
        		for (var i = 0; i < ids.length; i++) {
        			var id = ids[i];
        			if (id == null || id === "") continue;
        			var found = null;
        			for (var j = 0; j < termes.length; j++) {
        				var t = termes[j];
        				if (String(t.id || t.terme_id) === String(id)) { found = t; break; }
        			}
        			out.push(found ? (found.libelle || found.label || id) : id);
        		}
        		return out;
        	}
        	hasTermes() {
        		return this.listeTermes().length > 0;
        	}
        /*End_c8o_CompFunction*/
        '
