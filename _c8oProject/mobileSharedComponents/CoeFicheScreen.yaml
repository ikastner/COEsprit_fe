comment: Fiche profil CO Esprit — structure et classes alignées maquette.
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompDeclaration*/
        	editing: boolean;
        	query: string;
        	surligner: boolean;
        	domaineFiltre: string;
        	proposeOuvert: boolean;
        	proposeDomaine: string;
        	nouveauTerme: string;
        	messageProposition: string;
        	posteSaisie: string;
        	propositions: any[];
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.editing = false;
        		this.query = "";
        		this.surligner = false;
        		this.domaineFiltre = "";
        		this.proposeOuvert = false;
        		this.proposeDomaine = "";
        		this.nouveauTerme = "";
        		this.messageProposition = "";
        		this.posteSaisie = "";
        		this.propositions = [];
        /*End_c8o_CompConstructor*/
        /*Begin_c8o_CompFunction*/
        	f() {
        		return this.fiche || {};
        	}
        	val(k, fallback) {
        		if (fallback === undefined) fallback = "—";
        		var v = this.f()[k];
        		if (v == null || v === "") return fallback;
        		return "" + v;
        	}
        	canEdit() {
        		return !!this.editable;
        	}
        	isEditing() {
        		return this.canEdit() && !!this.editing;
        	}
        	startEdit() {
        		this.editing = true;
        		this.posteSaisie = this.valeurChamp(["libelle_poste", "libellePoste"]);
        		this.query = "";
        		this.domaineFiltre = "";
        		this.proposeOuvert = false;
        		this.proposeDomaine = "";
        		this.nouveauTerme = "";
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	cancelEdit() {
        		this.editing = false;
        		this.query = "";
        		this.domaineFiltre = "";
        		this.proposeOuvert = false;
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	emitSave() {
        		this.editing = false;
        		try { this.ref.detectChanges(); } catch (e) {}
        		if (this.save && this.save.emit) this.save.emit(this.f());
        	}
        	initials(name) {
        		var parts = String(name || "?").trim().split(/\s+/);
        		var a = (parts[0] || "?").charAt(0);
        		var b = parts.length > 1 ? parts[1].charAt(0) : "";
        		return (a + b).toUpperCase();
        	}
        	avatarColor(name) {
        		var s = String(name || "x");
        		var h = 0;
        		for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
        		return "hsl(" + h + " 42% 42%)";
        	}
        	photoSrc() {
        		var s = String(this.f().photo_url || this.f().photoUrl || "").trim();
        		if (!s) return "";
        		if (s.indexOf("data:") === 0) return s;
        		var mime = "image/jpeg";
        		if (s.indexOf("iVBOR") === 0) mime = "image/png";
        		else if (s.indexOf("R0lGOD") === 0) mime = "image/gif";
        		else if (s.indexOf("UklGR") === 0) mime = "image/webp";
        		return "data:" + mime + ";base64," + s;
        	}
        	nom() {
        		return this.val("nom_affiche", this.val("nom", "Profil"));
        	}
        	site() {
        		return this.val("site", "—");
        	}
        	perimetre() {
        		return this.val("perimetre", "—");
        	}
        	entitesLabel() {
        		var e = this.f().entites || this.f().entite_operationnelle || this.f().entiteOperationnelle || "";
        		if (Array.isArray(e)) return e.length ? e.join(", ") : "—";
        		return String(e).trim() || "—";
        	}
        	libellePoste() {
        		return this.val("libelle_poste", this.val("libellePoste", "Poste non renseigné"));
        	}
        	activites() {
        		return this.val("activites_principales", this.val("activitesPrincipales", "Pas encore renseigné."));
        	}
        	updatedLabel() {
        		var u = this.f().updated_at || this.f().updatedAt;
        		if (!u) return "—";
        		try {
        			var d = new Date(u);
        			if (isNaN(d.getTime())) return "" + u;
        			return d.toLocaleString("fr-FR");
        		} catch (e) {
        			return "" + u;
        		}
        	}
        	contactMail() {
        		return this.f().canal_mail || this.f().mail_si || this.f().mail || "";
        	}
        	contactTeams() {
        		return this.f().canal_teams || this.contactMail();
        	}
        	mailtoHref() {
        		var m = this.contactMail();
        		return m ? ("mailto:" + m) : null;
        	}
        	teamsHref() {
        		var m = this.contactTeams();
        		return m ? ("https://teams.microsoft.com/l/chat/0/0?users=" + encodeURIComponent(m)) : null;
        	}
        	perimetreOptions() {
        		return [
        			{ label: "Digital / SI", value: "Digital / SI" },
        			{ label: "Métier", value: "Métier" },
        			{ label: "Transverse", value: "Transverse" },
        			{ label: "Pilotage / Projet", value: "Pilotage / Projet" },
        			{ label: "Support", value: "Support" },
        			{ label: "National", value: "National" }
        		];
        	}
        	posteOptions() {
        		var cur = this.valeurChamp(["libelle_poste", "libellePoste"]);
        		var rows = (this.global && this.global.coeListes) || [];
        		var opts = (rows || []).filter(function (r) {
        			return r && String(r.liste) === "poste" && String(r.valeur || "").trim();
        		}).map(function (r) {
        			return { value: String(r.valeur), label: String(r.valeur) };
        		});
        		if (!opts.length) {
        			opts = [
        				{ label: "Chef de projet", value: "Chef de projet" },
        				{ label: "Chef de projet SI", value: "Chef de projet SI" },
        				{ label: "Chef de projet métier", value: "Chef de projet métier" },
        				{ label: "Pilote de communauté", value: "Pilote de communauté" },
        				{ label: "Architecte applicatif", value: "Architecte applicatif" }
        			];
        		}
        		if (cur && !opts.some(function (o) { return o.value === cur; })) {
        			opts = [{ value: cur, label: cur }].concat(opts);
        		}
        		return opts;
        	}
        	valeurListe(event) {
        		var v = event;
        		var guard = 0;
        		while (v && typeof v === "object" && guard < 5) {
        			if (v.target && v.target.value !== undefined) { v = v.target.value; guard++; continue; }
        			if (v.detail && v.detail.value !== undefined) { v = v.detail.value; guard++; continue; }
        			if (v.event && v.value === undefined && v.event.value !== undefined) { v = v.event.value; guard++; continue; }
        			if (v.value !== undefined) { v = v.value; guard++; continue; }
        			return String(v.label || v.libelle || "");
        		}
        		return v == null ? "" : String(v);
        	}
        	setPosteSelect(event) {
        		this.posteSaisie = this.valeurListe(event);
        		this.setChamp("libelle_poste", this.posteSaisie);
        	}
        	setQuery(event) {
        		var v = event && event.target ? event.target.value : event;
        		this.query = v == null ? "" : String(v);
        	}
        	catalogueTermes() {
        		var raw = (this.termes && this.termes.length) ? this.termes : ((this.global && this.global.coeTermes) || []);
        		var extra = this.propositions || [];
        		return (raw || []).concat(extra);
        	}
        	domainesEdit() {
        		return (this.global && this.global.coeDomaines) || [];
        	}
        	libelleDomaine(d) {
        		if (!d) return "";
        		return String(d.libelle || d.label || d.nom || "");
        	}
        	domaineOptions() {
        		return (this.domainesEdit() || []).map(function (d) {
        			return { value: String(d.id || d.domaine_id || ""), label: String(d.label || d.libelle || d.id || "") };
        		}).filter(function (o) { return o.value; });
        	}
        	termesFiltres() {
        		var q = String(this.query || "").trim().toLowerCase();
        		var d = String(this.domaineFiltre || "");
        		return this.catalogueTermes().filter(function (t) {
        			if (!t) return false;
        			var statut = String(t.statut || "").replace(/^\s+|\s+$/g, "").toLowerCase();
        			if (statut && statut !== "valide") return false;
        			var id = String(t.id || t.terme_id || "");
        			if (!id) return false;
        			if (d && String(t.domaine_id || t.domaineId || "") !== d) return false;
        			var lib = String(t.libelle || t.label || "").toLowerCase();
        			if (q && lib.indexOf(q) < 0) return false;
        			return true;
        		});
        	}
        	classeDomaineFiltre(d) {
        		var id = String((d && (d.id || d.domaine_id)) || "");
        		var on = id && id === String(this.domaineFiltre || "");
        		return "aide-chip aide-chip--" + ((d && d.tone) || "sky") + (on ? " is-active" : "");
        	}
        	toggleDomaineFiltre(d) {
        		var id = String((d && (d.id || d.domaine_id)) || "");
        		this.domaineFiltre = this.domaineFiltre === id ? "" : id;
        		if (this.proposeOuvert) this.proposeDomaine = this.domaineFiltre;
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	appsEdition() {
        		if (!this.fiche) this.fiche = {};
        		if (!Array.isArray(this.fiche.appetences)) {
        			var cur = this.appetencesDetail() || [];
        			this.fiche.appetences = cur.map(function (a) {
        				return {
        					id: String((a && (a.id || a.terme_id)) || ""),
        					libelle: String((a && (a.libelle || a.label)) || ""),
        					domaine_id: String((a && (a.domaine_id || a.domaineId)) || ""),
        					domaine: String((a && (a.domaine || a.domaine_label)) || ""),
        					tone: String((a && a.tone) || "")
        				};
        			}).filter(function (a) { return a.id; });
        		}
        		return this.fiche.appetences;
        	}
        	estCoche(t) {
        		var id = String((t && (t.id || t.terme_id)) || "");
        		return this.appsEdition().some(function (a) { return String(a.id || a.terme_id) === id; });
        	}
        	classeItem(t) {
        		return "aide-item" + (this.estCoche(t) ? " is-on" : "");
        	}
        	toggleTerme(t) {
        		if (!t) return;
        		var id = String(t.id || t.terme_id || "");
        		if (!id) return;
        		var apps = this.appsEdition();
        		var i = -1;
        		for (var n = 0; n < apps.length; n++) {
        			if (String(apps[n].id || apps[n].terme_id) === id) { i = n; break; }
        		}
        		if (i >= 0) apps.splice(i, 1);
        		else apps.push({
        			id: id,
        			libelle: String(t.libelle || t.label || ""),
        			domaine_id: String(t.domaine_id || t.domaineId || ""),
        			domaine: String(t.domaine || ""),
        			tone: String(t.tone || "")
        		});
        		this.fiche.terme_ids = apps.map(function (a) { return a.id; }).filter(Boolean).join(",");
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	normeLibelle(s) {
        		return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
        	}
        	nomDomaineDe(t) {
        		var nom = t && (t.domaine || t.domaine_label);
        		if (nom) return String(nom);
        		var id = String((t && (t.domaine_id || t.domaineId)) || "");
        		var rows = this.domainesEdit() || [];
        		for (var i = 0; i < rows.length; i++) {
        			if (String(rows[i].id || rows[i].domaine_id) === id) return String(rows[i].libelle || rows[i].label || id);
        		}
        		return id;
        	}
        	ouvrirProposition() {
        		this.proposeOuvert = !this.proposeOuvert;
        		this.proposeDomaine = this.domaineFiltre || "";
        		this.messageProposition = "";
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	classeAutre() {
        		return "aide-item aide-item--autre" + (this.proposeOuvert ? " is-on" : "");
        	}
        	domainePreRempli() {
        		var id = this.proposeDomaine || this.domaineFiltre || "";
        		if (id && typeof id === "object") id = this.valeurListe(id);
        		id = id == null ? "" : String(id);
        		if (!id || id === "[object Object]") return "";
        		var rows = this.domainesEdit();
        		for (var i = 0; i < rows.length; i++) {
        			if (String(rows[i].id || rows[i].domaine_id) === id) return String(rows[i].libelle || rows[i].label || id);
        		}
        		return id;
        	}
        	setProposeDomaine(event) {
        		this.proposeDomaine = this.valeurListe(event);
        	}
        	setNouveauTerme(event) {
        		var v = event && event.target ? event.target.value : event;
        		this.nouveauTerme = v == null ? "" : String(v);
        		this.messageProposition = "";
        	}
        	texteAideProposition() {
        		return this.messageProposition || "L\u2019appétence est ajoutée à ta fiche.";
        	}
        	proposer() {
        		var label = String(this.nouveauTerme || "").trim();
        		var domaine = String(this.proposeDomaine || this.domaineFiltre || "");
        		if (!label || !domaine) return;
        		var cible = this.normeLibelle(label);
        		var tous = (this.catalogueTermes() || []).concat(this.appsEdition() || []);
        		var noms = [];
        		for (var k = 0; k < tous.length; k++) {
        			var existant = tous[k];
        			if (!existant || this.normeLibelle(existant.libelle || existant.label) !== cible) continue;
        			var nomDom = this.nomDomaineDe(existant);
        			if (nomDom && noms.indexOf(nomDom) < 0) noms.push(nomDom);
        		}
        		if (noms.length) {
        			this.messageProposition = (noms.length > 1 ? "Ce libellé existe déjà dans les domaines " : "Ce libellé existe déjà dans le domaine ") + noms.join(", ") + ".";
        			try { this.ref.detectChanges(); } catch (e) {}
        			return;
        		}
        		var tone = "";
        		var nom = domaine;
        		var rows = this.domainesEdit();
        		for (var i = 0; i < rows.length; i++) {
        			if (String(rows[i].id || rows[i].domaine_id) === domaine) {
        				tone = String(rows[i].tone || "");
        				nom = String(rows[i].label || rows[i].libelle || domaine);
        				break;
        			}
        		}
        		var t = { id: "prop-" + Date.now(), libelle: label, domaine_id: domaine, domaine: nom, tone: tone };
        		this.propositions.push(t);
        		this.toggleTerme(t);
        		this.nouveauTerme = "";
        		this.proposeOuvert = false;
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	setPerimetre(v) {
        		if (!this.fiche) this.fiche = {};
        		this.fiche.perimetre = v;
        	}
        	setLibellePoste(v) {
        		if (!this.fiche) this.fiche = {};
        		this.fiche.libelle_poste = v;
        		this.fiche.libellePoste = v;
        	}
        	setActivites(v) {
        		if (!this.fiche) this.fiche = {};
        		this.fiche.activites_principales = v;
        		this.fiche.activitesPrincipales = v;
        	}
        	valeurChamp(keys) {
        		var f = this.f();
        		var list = Array.isArray(keys) ? keys : [keys];
        		for (var i = 0; i < list.length; i++) {
        			var v = f[list[i]];
        			if (v != null && String(v) !== "") return String(v);
        		}
        		return "";
        	}
        	valeurEntite() {
        		var e = this.f().entites || this.f().entiteOperationnelle || this.f().entite_operationnelle || "";
        		if (typeof e === "string") return e;
        		if (Array.isArray(e)) return e.join(", ");
        		return "";
        	}
        	setChamp(key, event) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = event.target.value;
        		else if (event && event.detail && event.detail.value != null) v = event.detail.value;
        		else if (typeof event === "string") v = event;
        		if (!this.fiche) this.fiche = {};
        		this.fiche[key] = v;
        		if (key === "sujets_aide") this.fiche.sujetsAide = v;
        		if (key === "libelle_poste") this.fiche.libellePoste = v;
        		if (key === "activites_principales") this.fiche.activitesPrincipales = v;
        	}
        	termeIds() {
        		var f = this.f();
        		var apps = f.appetences;
        		if (Array.isArray(apps)) {
        			return apps.map(function (a) { return a && (a.id || a.terme_id) || ""; }).filter(Boolean);
        		}
        		var ids = f.terme_ids || f.termeIds || [];
        		if (typeof ids === "string") {
        			try { ids = JSON.parse(ids); } catch (e) { ids = String(ids).split(","); }
        		}
        		return Array.isArray(ids) ? ids : [];
        	}
        	termesSelected() {
        		var ids = this.termeIds().map(function (x) { return String(x); });
        		var all = this.termes || [];
        		if (!Array.isArray(all)) return [];
        		return all.filter(function (t) {
        			return ids.indexOf(String(t.id || t.terme_id)) >= 0;
        		});
        	}
        	termeLibelle(t) {
        		return t && (t.libelle || t.label || t.id) || "";
        	}
        	sujetsAide() {
        		return String(this.f().sujets_aide || this.f().sujetsAide || "").trim();
        	}
        	appetencesDetail() {
        		var apps = this.f().appetences;
        		if (Array.isArray(apps) && apps.length) return apps;
        		return this.termesSelected();
        	}
        	codeSession() {
        		var u = this.global && this.global.user;
        		return String((u && (u.codeAgent || u.cle)) || "").toLowerCase();
        	}
        	estMaFiche() {
        		var code = this.codeSession();
        		return !!code && code === String(this.f().user_id || "").toLowerCase();
        	}
        	maFiche() {
        		return (this.global && this.global.coeMaFiche) || null;
        	}
        	mesIds() {
        		var me = this.maFiche();
        		if (!me) return [];
        		if (Array.isArray(me.appetences)) {
        			return me.appetences.map(function (a) { return String((a && (a.id || a.terme_id)) || ""); }).filter(Boolean);
        		}
        		var ids = me.terme_ids || me.termeIds || [];
        		if (typeof ids === "string") ids = ids.split(",");
        		return (ids || []).map(function (x) { return String(x).trim(); }).filter(Boolean);
        	}
        	appetencesCommunes() {
        		if (this.estMaFiche()) return 0;
        		var set = {};
        		var mine = this.mesIds();
        		for (var i = 0; i < mine.length; i++) set[mine[i]] = true;
        		var n = 0;
        		var apps = this.appetencesDetail();
        		for (var j = 0; j < apps.length; j++) {
        			var id = String((apps[j] && (apps[j].id || apps[j].terme_id)) || "");
        			if (set[id]) n++;
        		}
        		return n;
        	}
        	libelleCommunes() {
        		var n = this.appetencesCommunes();
        		return n + " appétence" + (n > 1 ? "s" : "") + " en commun";
        	}
        	toggleCommunes() {
        		this.surligner = !this.surligner;
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	classeCommunes() {
        		return "aide-form__appetences-shared" + (this.surligner ? " is-on" : "");
        	}
        	groupesConsultation() {
        		var apps = this.appetencesDetail();
        		var mine = {};
        		if (this.surligner && !this.estMaFiche()) {
        			var ids = this.mesIds();
        			for (var i = 0; i < ids.length; i++) mine[ids[i]] = true;
        		}
        		var map = {};
        		var order = [];
        		for (var j = 0; j < apps.length; j++) {
        			var a = apps[j];
        			if (!a) continue;
        			var did = String(a.domaine_id || a.domaineId || "autre");
        			if (!map[did]) {
        				map[did] = {
        					id: did,
        					label: a.domaine || a.domaineLibelle || "Autre",
        					tone: a.tone || "sky",
        					termes: []
        				};
        				order.push(did);
        			}
        			var tid = String(a.id || a.terme_id || "");
        			map[did].termes.push({
        				id: tid,
        				libelle: a.libelle || a.label || tid,
        				shared: !!mine[tid]
        			});
        		}
        		return order.map(function (id) { return map[id]; });
        	}
        	classeDomaine(g) {
        		return "aide-chip aide-chip--" + ((g && g.tone) || "sky") + " aide-chip--static aide-consult__domaine";
        	}
        	classeTag(t) {
        		var id = String((t && (t.id || t.terme_id)) || "");
        		var on = false;
        		if (this.surligner && !this.estMaFiche() && id) {
        			var mine = this.mesIds();
        			for (var i = 0; i < mine.length; i++) {
        				if (mine[i] === id) { on = true; break; }
        			}
        		}
        		return "aide-consult__tag" + (on ? " is-shared" : "");
        	}
        	memeSite() {
        		if (this.estMaFiche()) return false;
        		var me = this.maFiche() || {};
        		var a = String(this.f().site || "").trim().toLowerCase();
        		var b = String(me.site || "").trim().toLowerCase();
        		return !!a && a === b;
        	}
        	indicateurs() {
        		var g = this.global && this.global.coeIndicateurs;
        		if (!g) return null;
        		var id = String(this.f().user_id || "").toLowerCase();
