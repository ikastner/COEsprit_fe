            line-height: 1.35;
            font-weight: 400;
            letter-spacing: .02em;
            color: rgba(255, 255, 255, 0.55);
            white-space: normal;
          }
          .sidebar__user-version {
            margin: 0;
            padding: 3px 10px;
            border-radius: 999px;
            background: #fff;
            color: #1A428A;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1.3;
            flex: 0 0 auto;
          }
          .sidebar.is-collapsed .sidebar__foot,
          .sidebar.is-settled .sidebar__foot { display: none; }
          .sidebar.is-collapsed .sidebar__collapse .nav-ico { transform: rotate(180deg); }
          .sidebar.is-settled .sidebar__app,
          .sidebar.is-settled .sidebar__section,
          .sidebar.is-settled .nav-btn__label,
          .sidebar.is-settled .nav-btn__badge,
          .sidebar.is-settled .sidebar__user-text { display: none; }
          .sidebar.is-collapsed .sidebar__brand,
          .sidebar.is-settled .sidebar__brand { flex-direction: column; gap: 8px; padding: 0; }
          .sidebar.is-collapsed .sidebar__collapse,
          .sidebar.is-settled .sidebar__collapse { margin-left: 0; }
          .sidebar.is-collapsed .nav-btn,
          .sidebar.is-collapsed .sidebar__brand,
          .sidebar.is-settled .nav-btn,
          .sidebar.is-settled .sidebar__brand { justify-content: center; gap: 0; }
          .sidebar.is-collapsed .sidebar__user,
          .sidebar.is-settled .sidebar__user {
            align-items: center;
            justify-content: center;
            gap: 8px;
          }
          .sidebar.is-collapsed .sidebar__user-row,
          .sidebar.is-settled .sidebar__user-row {
            flex-direction: column;
            align-items: center;
            gap: 8px;
