          .sidebar.is-collapsed .sidebar__logout,
          .sidebar.is-settled .sidebar__logout { margin-left: 0; }
          .sidebar__user-version {
            margin-top: 2px;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,.55);
            letter-spacing: .02em;
          }
          .sidebar.is-settled .sidebar__user-version { display: none; }
