        '/*Begin_c8o_CompDeclaration*/
        	appVersion: string = "";
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompInitialization*/
        		this.folded = false;
        		if (!document.getElementById("pfa-fonts")) {
        			var fonts = this.c8o.endpointConvertigo + "/projects/COEsprit_fe/DisplayObjects/mobile/assets/fonts/";
        			var face = function (famille, poids, fichier) {
        				return ''@font-face { font-family: "'' + famille + ''"; font-style: normal; font-weight: '' + poids + ''; font-display: swap; src: url("'' + fonts + fichier + ''") format("woff2"); }'';
        			};
        			var style = document.createElement("style");
        			style.id = "pfa-fonts";
        			style.textContent = face("Montserrat", 700, "montserrat-latin-700-normal.woff2") + face("Roboto", 400, "roboto-latin-400-normal.woff2");
        			document.head.appendChild(style);
        		}
        		if (!document.querySelector("link[data-coe-bundle]")) {
        			var base = this.c8o.endpointConvertigo + "/projects/COEsprit_fe/DisplayObjects/mobile/";
        			var link = document.createElement("link");
        			link.rel = "stylesheet";
        			link.href = base + "assets/css/coe-bundle.css";
        			link.setAttribute("data-coe-bundle", "1");
        			document.head.appendChild(link);
        		}
        		var sideNow = document.documentElement.style.getPropertyValue("--pfa-side");
        		if (String(sideNow).indexOf("76") === 0) this.folded = true;
        		else document.documentElement.style.setProperty("--pfa-side", "280px");
        		this.restaurerIdentite();
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompChanges*/
        		this.restaurerIdentite();
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompAfterViewInit*/
        		var unlockNav = function () {
        			var btns = document.querySelectorAll(".sidebar button");
        			for (var i = 0; i < btns.length; i++) {
        				var btn: any = btns[i];
        				if (!btn.disabled && !btn.hasAttribute("disabled")) continue;
        				btn.disabled = false;
        				btn.removeAttribute("disabled");
        			}
        		};
        		unlockNav();
        		setTimeout(unlockNav, 0);
        		var sideRoot: any = document.querySelector(".sidebar");
        		if (sideRoot && !sideRoot.__pfaUnlock && window.MutationObserver) {
        			sideRoot.__pfaUnlock = true;
        			var obs = new MutationObserver(function () { unlockNav(); });
        			obs.observe(sideRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ["disabled"] });
        		}
        		this.chargerVersion();
        		this.chargerIdentite();
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompFunction*/
        	choisir(route) {
        		if (this.navigate && this.navigate.emit) this.navigate.emit(route);
        	}
        	basculer() {
        		var host: any = this.elRef && this.elRef.nativeElement;
        		var side: any = host && host.querySelector ? host.querySelector(".sidebar") : null;
        		if (!side && host && host.classList && host.classList.contains("sidebar")) side = host;
        		var opening = this.folded === true;
        		if (opening && side) side.classList.remove("is-settled");
        		this.folded = !this.folded;
        		var pad = this.folded ? "76px" : "280px";
        		var content: any = document.querySelector("ion-content.pfc-page");
        		if (content) content.style.setProperty("--pfa-pad", pad);
        		document.documentElement.style.setProperty("--pfa-side", pad);
        		if (!side) return;
        		if (side.__pfaEnd) {
        			side.removeEventListener("transitionend", side.__pfaEnd);
        			side.__pfaEnd = null;
        		}
        		if (side.__pfaTimer) {
        			clearTimeout(side.__pfaTimer);
        			side.__pfaTimer = null;
        		}
        		if (!this.folded) return;
        		var self = this;
        		var onEnd = function (ev) {
        			if (ev && ev.propertyName && ev.propertyName !== "width") return;
        			side.removeEventListener("transitionend", onEnd);
        			if (side.__pfaTimer) clearTimeout(side.__pfaTimer);
        			side.__pfaEnd = null;
        			side.__pfaTimer = null;
        			if (self.folded) side.classList.add("is-settled");
        		};
        		side.__pfaEnd = onEnd;
        		side.addEventListener("transitionend", onEnd);
        		side.__pfaTimer = setTimeout(function () { onEnd(null); }, 240);
        	}
        	lireCache() {
        		var g: any = this.global || {};
        		var c = g.coeIdentite || {};
        		var u = g.user || {};
        		var nom = String(c.nom || u.displayName || u.nom || "").trim();
        		var photo = String(c.photo || u.photo || "").trim();
        		var role = String(c.role || "").trim();
        		if (!role && u.role) role = Array.isArray(u.role) ? u.role.join(", ") : String(u.role || "");
        		return { nom: nom, photo: photo, role: role, charge: !!c.charge };
        	}
        	restaurerIdentite() {
        		var c = this.lireCache();
        		if (c.nom && !String(this.userName || "").trim()) this.userName = c.nom;
        		if (c.photo && !String(this.photoUrl || "").trim()) this.photoUrl = c.photo;
        		if (c.role && !String(this.userRole || "").trim()) this.userRole = c.role;
        		var v = window["__pfaVersion"];
        		if (v && !this.appVersion) this.appVersion = v;
        	}
        	memoriserIdentite() {
        		var g: any = this.global;
        		if (!g) return;
        		if (!g.coeIdentite) g.coeIdentite = {};
        		if (g.user && g.user.codeAgent) g.coeIdentite.codeAgent = g.user.codeAgent;
        		if (this.userName) g.coeIdentite.nom = this.userName;
        		if (this.photoUrl) g.coeIdentite.photo = this.photoUrl;
        		if (this.userRole) g.coeIdentite.role = this.userRole;
        		g.coeIdentite.charge = true;
        		if (g.user) {
        			if (this.userName) { g.user.displayName = this.userName; g.user.nom = this.userName; }
        			if (this.photoUrl) g.user.photo = this.photoUrl;
        		}
        	}
        	photoSrc() {
        		var s = String(this.photoUrl || "").trim();
        		if (!s) return "";
        		if (s.indexOf("data:") === 0) return s;
        		var mime = "image/jpeg";
        		if (s.indexOf("iVBOR") === 0) mime = "image/png";
        		else if (s.indexOf("R0lGOD") === 0) mime = "image/gif";
        		else if (s.indexOf("UklGR") === 0) mime = "image/webp";
        		return "data:" + mime + ";base64," + s;
        	}
        	appliquerIdentite(nom, photo) {
        		nom = String(nom || "").trim();
        		photo = String(photo || "").trim();
        		try {
        			var garde: any = this.global && this.global.coeIdentite;
        			if (photo && this.photoUrl && photo !== this.photoUrl && garde && garde.photo === this.photoUrl && garde.photoAt && (Date.now() - garde.photoAt) < 20000) photo = "";
        		} catch (eG) {}
        		if (nom) this.userName = nom;
        		if (photo) this.photoUrl = photo;
        		try {
        			var owner: any = this.owner;
        			if (owner) {
        				if (nom) owner.pfaUserName = nom;
        				if (photo) owner.pfaUserPhoto = photo;
        			}
        			var g: any = this.global;
        			if (g && g.user) {
        				if (nom) { g.user.displayName = nom; g.user.nom = nom; }
        				if (photo) g.user.photo = photo;
        			}
        		} catch (e1) {}
        		this.memoriserIdentite();
        		try { this.ref.detectChanges(); } catch (e2) {}
        	}
        	drapeaux() {
        		var g: any = this.global || {};
        		var u = g.user || {};
        		var c = g.coeIdentite || {};
        		var oui = function (v) { return v === true || v === "true" || v === "t" || v === "oui" || v === "1"; };
        		var codeU = String(u.codeAgent || "");
        		var codeC = String(c.codeAgent || "");
        		var meme = !codeU || !codeC || codeU.toUpperCase() === codeC.toUpperCase();
        		var roles = u.role;
        		var roleAdmin = roles === "admin" || (Array.isArray(roles) && roles.indexOf("admin") >= 0);
        		var session = String(u.roleSession || (meme ? c.roleSession : "") || "");
        		if (!session && roleAdmin) session = "admin";
        		return {
        			roleSession: session,
        			roleLocal: String(u.roleLocal || (meme ? c.roleLocal : "") || ""),
        			piloteCommunaute: meme ? (oui(u.piloteCommunaute) || oui(c.piloteCommunaute)) : oui(u.piloteCommunaute),
        			idCommunaute: String((meme ? (u.idCommunaute || c.idCommunaute) : u.idCommunaute) || "")
        		};
        	}
        	montreEspace() {
        		var d = this.drapeaux();
        		return d.roleSession !== "admin" || !!d.idCommunaute;
        	}
        	libelleRole() {
        		var d = this.drapeaux();
        		if (d.roleSession === "admin") return "Admin";
        		if (d.piloteCommunaute) return "Pilote communauté";
        		if (d.roleLocal === "pilote") return "Pilote périmètre";
        		return "Membre";
        	}
        	peutAdmin() {
        		return this.drapeaux().roleSession === "admin";
        	}
        	peutPilote() {
        		var d = this.drapeaux();
        		return d.roleLocal === "pilote" || d.piloteCommunaute === true;
        	}
        	memoriserDrapeaux(f) {
        		if (!f) return;
        		var g: any = this.global;
        		if (!g) return;
        		if (!g.user) g.user = {};
        		if (!g.coeIdentite) g.coeIdentite = {};
        		var oui = function (v) { return v === true || v === "true" || v === "t" || v === "oui" || v === "1"; };
        		var session = String(f.role_session || f.roleSession || g.user.roleSession || "");
        		var local = String(f.role_local || f.roleLocal || g.user.roleLocal || "");
        		g.user.roleSession = session;
        		g.user.roleLocal = local;
        		g.user.idCommunaute = String(f.id_communaute || f.idCommunaute || "");
        		if (f.pilote_communaute != null || f.piloteCommunaute != null) {
        			g.user.piloteCommunaute = oui(f.pilote_communaute != null ? f.pilote_communaute : f.piloteCommunaute);
        		}
        		g.coeIdentite.roleSession = g.user.roleSession;
        		g.coeIdentite.roleLocal = g.user.roleLocal;
        		g.coeIdentite.piloteCommunaute = !!g.user.piloteCommunaute;
        	}
        	chargerIdentite() {
        		var g: any = this.global || {};
        		var u = g.user || {};
        		var c = g.coeIdentite || {};
        		var codeU = String(u.codeAgent || "");
        		var codeC = String(c.codeAgent || "");
        		if (codeU && codeC && codeU.toUpperCase() !== codeC.toUpperCase()) {
        			g.coeIdentite = { codeAgent: codeU, nom: String(u.displayName || u.nom || ""), photo: String(u.photo || ""), roleSession: u.roleSession || "", roleLocal: u.roleLocal || "", piloteCommunaute: !!u.piloteCommunaute, charge: true };
        			this.userName = g.coeIdentite.nom;
        			this.photoUrl = g.coeIdentite.photo;
        		}
        		this.restaurerIdentite();
        		if (codeU) this.userName = String(u.displayName || u.nom || this.userName || "");
        		if (this.lireCache().charge && String(this.userName || "").trim() && this.drapeaux().roleSession && (!codeU || String((g.coeIdentite || {}).codeAgent || "").toUpperCase() === codeU.toUpperCase())) return;
        		var self: any = this;
        		try {
        			var p: any = this.c8o.callJsonObject("COEsprit_be.Fiche_Lire", { user_id: "" });
        			p.then(function (res) {
        				var d = (res && res.document) ? res.document : (res || {});
        				var f = d.fiche || (d.document && d.document.fiche) || null;
        				if (Array.isArray(f)) f = f[0];
        				if (!f && d.nom_affiche) f = d;
        				if (!f) return null;
        				self.memoriserDrapeaux(f);
        				var nom = String(f.nom_affiche || f.nomAffiche || "");
        				var photo = String(f.photo_url || f.photoUrl || "");
        				if (!String(self.userName || "").trim() || (!String(self.photoUrl || "").trim() && photo)) self.appliquerIdentite(nom, photo);
        				else { try { self.ref.detectChanges(); } catch (e4) {} }
        				return null;
        			});
        			if (p.fail) p.fail(function () { return p; });
        		} catch (e3) {}
        	}
        	initiales() {
        		var parts = String(this.userName || "?").trim().split(" ");
        		var a = (parts[0] || "?").charAt(0);
        		var b = parts.length > 1 ? parts[1].charAt(0) : (parts[0] || "?").charAt(1);
        		return (a + (b || "")).toUpperCase();
        	}
        	chargerVersion() {
        		if (window["__pfaVersion"]) {
        			this.appVersion = window["__pfaVersion"];
        			return;
        		}
        		var self = this;
        		try {
        			var p: any = this.c8o.callJsonObject("COEsprit_fe.get_version", {});
        			p.then(function (res) {
        				var d = (res && res.document) ? res.document : (res || {});
        				var v = d.version;
        				if (v == null && d.data) v = d.data.version;
        				self.appVersion = String(v == null ? "" : v).trim();
        				if (self.appVersion) window["__pfaVersion"] = self.appVersion;
        				try { self.ref.detectChanges(); } catch (e) {}
        				return null;
        			});
        			if (p.fail) p.fail(function () { return p; });
        		} catch (e2) {}
        	}
        	/*End_c8o_CompFunction*/
