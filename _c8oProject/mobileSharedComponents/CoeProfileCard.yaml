        →: |
          ':host {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-width: 0;
          }
          :host .profile-card {
            flex: 1 1 auto;
          }
          :host .profile-card .avatar {
            border-radius: 14px !important;
            width: 48px !important;
            height: 48px !important;
          }
          :host .profile-card__name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          :host .profile-card__meta {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          :host .profile-card__domaines,
          :host .profile-card__appetences {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
          }
          :host .profile-card__domaines { height: 28px; }
          :host .profile-card__appetences { height: 32px; }
          :host .profile-card__appetences .cv-tag {
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          :host .profile-card__domaines .chip,
          :host .profile-card__appetences .chip {
            flex: 0 0 auto;
            white-space: nowrap;
          }
          :host .profile-card__body {
            margin: 0;
            min-height: calc(1.45em * 2);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }
          '
