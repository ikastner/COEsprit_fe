    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompDeclaration*/
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompFunction*/
        	libelle() {
        		return "" + (this.nom || this.userId || "Profil");
        	}
        	poste() {
        		return "" + (this.libellePoste || "");
        	}
        	meta() {
        		var poste = (this.libellePoste || "").toString().trim();
        		var site = (this.site || "").toString().trim();
        		if (poste && site) return poste + " · " + site;
        		return poste || site || "Poste non renseigné";
        	}
        	body() {
        		var t = this.activites || "";
        		return t ? ("" + t) : "Activités non renseignées pour le moment.";
        	}
        	initials() {
        		var parts = String(this.libelle()).trim().split(/\s+/).filter(Boolean);
        		return parts.slice(0, 2).map(function (p) { return (p[0] || "").toUpperCase(); }).join("");
        	}
        	photoSrc() {
        		var s = String(this.photoUrl || "").trim();
        		if (!s) return "";
        		if (s.indexOf("data:") === 0) return s;
        		var mime = "image/jpeg";
        		if (s.indexOf("iVBOR") === 0) mime = "image/png";
        		else if (s.indexOf("R0lGOD") === 0) mime = "image/gif";
        		else if (s.indexOf("UklGR") === 0) mime = "image/webp";
        		return "data:" + mime + ";base64," + s;
        	}
        	parseTermeIds(raw = undefined) {
        		if (raw === undefined) raw = this.termeIds;
        		if (raw == null || raw === "") return [];
        		if (Array.isArray(raw)) return raw.map(function (x) { return String(x && (x.id || x.terme_id || x)); }).filter(Boolean);
        		if (typeof raw === "object") {
        			if (raw.row != null) return this.parseTermeIds(raw.row);
        			var vals = Object.keys(raw).filter(function (k) { return /^\d+$/.test(k); }).map(function (k) { return raw[k]; });
        			if (vals.length) return this.parseTermeIds(vals);
        		}
        		return String(raw).split(/[,;|]/).map(function (s) { return s.trim(); }).filter(Boolean);
        	}
        	refTermes() {
        		if (Array.isArray(this.termes) && this.termes.length) return this.termes;
        		var g = this.global && this.global.coeTermes;
        		return Array.isArray(g) ? g : [];
        	}
        	refDomaines() {
        		if (Array.isArray(this.domaines) && this.domaines.length) return this.domaines;
        		var g = this.global && this.global.coeDomaines;
        		return Array.isArray(g) ? g : [];
        	}
        	rowTermeLibelles() {
        		var raw = this.termeLibelles;
        		if (raw == null || raw === "") return [];
        		return String(raw).split("|").map(function (s) { return s.trim(); }).filter(Boolean);
        	}
        	rowDomaineChips() {
        		var raw = this.domaineChipsRaw;
        		if (raw == null || raw === "") return [];
        		return String(raw).split("|").map(function (s) { return s.trim(); }).filter(Boolean).map(function (part) {
        			var bits = part.split("::");
        			return {
        				id: bits[0] || part,
        				label: bits[1] || bits[0] || part,
        				tone: bits[2] || "sky"
        			};
        		});
        	}
        	termesMatched() {
        		var ids = this.parseTermeIds();
        		var all = this.refTermes();
        		var labels = this.rowTermeLibelles();
        		if (!ids.length && !labels.length) return [];
        		var out = [];
        		var n = Math.max(ids.length, labels.length);
        		for (var i = 0; i < n; i++) {
        			var id = ids[i] || "";
        			var hit = null;
        			if (id) {
        				for (var j = 0; j < all.length; j++) {
        					var t = all[j];
        					if (String(t.id || t.terme_id) === id) { hit = t; break; }
        				}
        			}
        			if (hit) {
        				out.push(hit);
        			} else if (labels[i] || id) {
        				out.push({ id: id || labels[i], terme_id: id, libelle: labels[i] || id, domaine_id: "" });
        			}
        		}
        		return out;
        	}
        	domaineChips() {
        		var fromRow = this.rowDomaineChips();
        		if (fromRow.length) return fromRow;
        		var matched = this.termesMatched();
        		var domaines = this.refDomaines();
        		var seen = {};
        		var out = [];
        		for (var i = 0; i < matched.length; i++) {
        			var did = matched[i].domaine_id || matched[i].domaineId;
        			if (!did || seen[did]) continue;
        			seen[did] = true;
        			var d = null;
        			for (var j = 0; j < domaines.length; j++) {
        				var dj = domaines[j];
        				var djId = dj && (dj.id || dj.domaine_id);
        				if (String(djId) === String(did)) { d = dj; break; }
        			}
        			out.push({
        				id: did,
        				label: d ? (d.libelle || d.label || did) : did,
        				tone: d ? (d.tone || "sky") : "sky"
        			});
        		}
        		return out;
        	}
        	hasDomaines() {
        		return this.domaineChips().length > 0;
        	}
        	domainesAffiches() {
        		var all = this.domaineChips();
        		var shown = all.slice(0, 3);
        		var rest = all.length - shown.length;
        		if (rest > 0) shown.push({ id: "more-domaines", label: "+" + rest, plus: true });
        		return shown;
        	}
        	appetencesPreview() {
        		return this.termesMatched().slice(0, 3).map(function (t) {
        			return t.libelle || t.label || t.id;
        		});
        	}
        	appetencesRest() {
        		return Math.max(0, this.termesMatched().length - 3);
        	}
        	chipClass(d) {
        		if (d && d.plus) return "chip chip--muted";
        		return "aide-chip aide-chip--" + (d && d.tone ? d.tone : "sky") + " aide-chip--static";
        	}
        	emitOpen() {
        		if (this.open && this.open.emit) this.open.emit({ userId: this.userId, nom: this.nom });
        	}
        /*End_c8o_CompFunction*/
        '
