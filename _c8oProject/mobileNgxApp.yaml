↓Style [ngx.components.UIStyle-1792354075143]: 
  comment: You can add some global application styles here
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '/* Bundle maquette charge via index.html (assets/css/coe-bundle.css). */
          [hidden] {
            display: none !important;
          }
          ion-menu ion-content {
            --background: var(--ion-item-background, var(--ion-background-color, #fff));
          }
          .search-bar ion-input.input,
          .search-bar ion-input {
            --background: var(--c-white, #fff);
            --padding-start: 12px;
            --padding-end: 12px;
            --padding-top: 10px;
            --padding-bottom: 10px;
            min-height: var(--control-h, 44px);
            border: 1px solid var(--c-border, #D0D7E2);
            border-radius: var(--r-md, 12px);
            width: 100%;
            margin: 0;
          }
          .search-bar select.input {
            width: 100%;
            height: var(--control-h, 44px);
            padding: 0 12px;
            border: 1px solid var(--c-border, #D0D7E2);
            border-radius: var(--r-md, 12px);
            background: var(--c-white, #fff);
            color: var(--c-text, #1B2430);
            font: inherit;
            font-size: 15px;
          }
          .search-bar .btn { height: var(--control-h-sm, 40px); }
          .search-bar__main .field { min-width: 0; }
          .profile-card .avatar, .cv-avatar { background: var(--c-primary, #1A428A); color: #fff; }
          .cv-avatar--photo, .profile-card .avatar.avatar--photo { background: transparent; }
          .cv-avatar__file { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
          .cv-hero__titleline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
          .cv-indicator { display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px; border-radius: 999px; background: #eff4ff; color: #1a428a; font-size: 13px; }
          .aide-sujets__text { margin: 0 0 16px; font-size: 16px; line-height: 1.5; }
          .aide-sujets__text.is-empty { color: #6b7280; font-style: italic; }
          .aide-form__appetences-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
          .aide-form__appetences-label { margin: 0; }
          .aide-form__appetences-meta { display: flex; align-items: center; gap: 8px; }
          .aide-form__appetences-shared { border: 0; border-radius: 999px; background: #eff4ff; color: #1a428a; min-height: 32px; padding: 4px 12px; cursor: pointer; }
          .aide-form__appetences-shared.is-on { background: #1a428a; color: #fff; }
          .aide-form__appetences-count { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 8px; border-radius: 999px; background: #eff4ff; color: #1a428a; font-weight: 700; font-size: 14px; }
          .aide-consult { display: flex; flex-direction: column; gap: 14px; }
          .aide-consult__row { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 12px 16px; align-items: start; }
          .aide-consult__tags { display: flex; flex-wrap: wrap; gap: 8px; }
          .aide-consult__tag { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: #eff4ff; color: #1a428a; }
          .aide-consult__tag.is-shared { background: #1a428a; color: #fff; }
          .cv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
          .cv-stat { display: flex; flex-direction: column; gap: 4px; }
          .cv-stat__value { font-size: 2.5rem; font-weight: 700; line-height: 1; color: #1a428a; }
          .cv-stat__label { font-size: 14px; color: #495057; }
          .skel-wrap { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 24px; }
          .skel-wrap--cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
          .skel { height: 52px; border-radius: 16px; background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%); background-size: 400% 100%; animation: colsh 1.2s ease infinite; }
          .skel--hero { height: 148px; border-radius: 24px; }
          .skel--card { height: 168px; }
          @keyframes colsh { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
          @media (prefers-reduced-motion: reduce) { .skel { animation: none; background: #eef2f7; } }
          .topbar { margin: 0 0 16px; }
          .topbar__title { margin: 0; font-size: 28px; color: #1a428a; }
          .topbar__subtitle { margin: 4px 0 0; color: #495057; }
          @media (max-width: 720px) { .aide-consult__row { grid-template-columns: 1fr; } }
          '
