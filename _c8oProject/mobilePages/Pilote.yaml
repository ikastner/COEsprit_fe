        		}
        		var root = doc && (doc.document || doc);
        		if (!root || typeof root !== "object") return [];
        		var named = root[name];
        		if (!named && root.document) named = root.document[name];
        		var got = named && (sqlRows(named) || rows(named));
        		if (got && got.length) return got;
        		if (named && typeof named === "object" && (named.ok != null || named.id != null || named.code_agent != null || named.libelle != null) && !named.sql_output) return [named];
        		var txMap = { Lire_acteur: "T_Acteur_Droits", Lire_structure: "T_Structure_Lire", Lire_membres: "T_Membres_Lire", Lire_agents: "T_Agent_Chercher", Lire_domaines: "T_Pilote_Domaines", Lire_termes: "T_Pilote_Termes" };
        		var want = txMap[name] || "";
        		function labelOf(node) {
        			if (!node || typeof node !== "object") return "";
        			var a = node.attr || {};
        			var d = node.document && typeof node.document === "object" && !Array.isArray(node.document) ? node.document : null;
        			var da = d && d.attr ? d.attr : {};
