        	rowsOf(doc, name) {
        		function rows(x) {
        			if (!x) return null;
        			if (Array.isArray(x)) return x;
        			if (x.row != null) { var r = x.row; return Array.isArray(r) ? r : [r]; }
        			if (typeof x === "object") {
        				var keys = Object.keys(x);
