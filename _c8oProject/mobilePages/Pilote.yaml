        		}
        		var nom = String(this.nomCommunauteEdition || "").trim();
        		if (!n || !nom) { this.toast = "Saisissez un nom"; return; }
        		this.renamingCommunaute = "";
        		this.muter("Structure_Enregistrer", { action: "renommer", node_id: n.id, parent_id: "", libelle: nom, actif: "oui" }, "Nom enregistré");
        	}
