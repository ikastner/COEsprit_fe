        		this.muter("Membre_Ajouter", { code_agent: code, id_communaute: id, id_perimetre: peri, role: "pilote_communaute" }, "Pilote de communauté ajouté");
        	}
        	membresFiltres() {
        		var n = this.noeud();
        		if (!n || !n.parent_id) return [];
        		var q = String(this.filtreMembre || "").toLowerCase();
        		return this.membresDu(n.id, "id_perimetre").filter(function (m) {
        			if (!q) return true;
        			var hay = String(m.nom_affiche || "") + " " + String(m.mail || "") + " " + String(m.site || "") + " " + String(m.entite_operationnelle || "");
        			return hay.toLowerCase().indexOf(q) >= 0;
        		});
        	}
        	roleValeur(m) {
