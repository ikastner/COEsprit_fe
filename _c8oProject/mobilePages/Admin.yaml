        			{ id: "recherche", label: "Rechercher des profils" },
        			{ id: "proposer", label: "Proposer une appétence" },
        			{ id: "membres", label: "Ajouter et retirer des membres" },
        			{ id: "referentiel", label: "Gérer le référentiel d’appétences" },
        			{ id: "perimetres", label: "Créer des périmètres de travail" },
        			{ id: "pilotes", label: "Nommer les pilotes" }
