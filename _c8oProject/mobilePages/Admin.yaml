        	}
        	termesFiltres() {
        		var st = this.filtreStatut || "valide";
        		return ((this.local && this.local.termes) || []).filter(function (t) { return t && String(t.statut) === st; });
        	}
        	domaineOptions() {
        		return this.listeDomaines().map(function (d) { return { label: String(d.libelle || ""), value: String(d.id || "") }; });
        	}
        	statutTerme(t, statut) {
        		if (!t) return;
        		this.muter("Terme_Statut", { terme_id: t.id, statut: statut }, "Statut enregistré");
        	}
        	deplacer(t, domaineId) {
        		if (!t || !domaineId || String(domaineId) === String(t.domaine_id || "")) return;
        		this.muter("Terme_Deplacer", { terme_id: t.id, domaine_id: String(domaineId) }, "Domaine mis à jour");
        	}
        	creerDomaine() {
        		var n = this.noeud();
        		var nom = String(this.libelleDomaine || "").trim();
        		if (!n || !nom) { this.toast = "Saisissez un nom"; return; }
        		this.libelleDomaine = "";
        		this.ajoutDomaine = false;
        		this.muter("Domaine_Enregistrer", { action: "creer", node_id: "", id_perimetre: n.id, libelle: nom }, "Domaine créé");
        	}
        	renommerDomaine(d) {
        		var n = this.noeud();
        		if (!d || !n) return;
        		var nom = window.prompt("Nom du domaine", String(d.libelle || ""));
        		if (!nom || !String(nom).trim()) return;
        		this.muter("Domaine_Enregistrer", { action: "renommer", node_id: d.id, id_perimetre: n.id, libelle: String(nom).trim() }, "Domaine renommé");
        	}
        	creerTerme() {
        		var n = this.noeud();
        		var nom = String(this.libelleTerme || "").trim();
