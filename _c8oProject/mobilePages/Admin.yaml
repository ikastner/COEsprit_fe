        		if (v === "pilote_perimetre") return "Pilote périmètre";
        		return "Membre";
        	}
        	entiteDe(m) {
        		var s = m ? String(m.entite_operationnelle || "").trim() : "";
        		return s || "—";
        	}
        	changerRole(m, role) {
