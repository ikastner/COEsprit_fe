        		var surCommunaute = !!(n && !n.parent_id && (this.estAdmin() || this.estPiloteCommunaute(n.id)));
        		if (!m || (!this.peutNommer() && !surCommunaute)) return;
        		this.muter("Membre_Role", { code_agent: m.code_agent, role: String(role || "membre") }, "Rôle enregistré");
        	}
        	retirer(m) {
        		if (!m) return;
        		this.muter("Membre_Retirer", { code_agent: m.code_agent }, "Accès retiré");
        	}
        	ouvrirDrawer() {
        		if (!this.peutAjouter() && this.vue !== "admin") return;
        		this.drawerMode = "add";
        		this.membreEdition = null;
        		this.drawer = true;
        		this.agentCode = "";
        		this.roleAjout = "membre";
        		this.chercherAgents();
        	}
        	ouvrirEdition(m) {
        		if (!m) return;
        		this.drawerMode = "edit";
        		this.membreEdition = m;
        		this.roleAjout = this.roleValeur(m);
        		this.drawer = true;
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	titreDrawer() {
        		return this.drawerMode === "edit" ? "Modifier un membre" : "Ajouter un membre";
        	}
        	fermerDrawer() { this.drawer = false; this.membreEdition = null; this.drawerMode = "add"; }
        	chercherAgents() {
        		var self: any = this;
        		var p: any = self.c8o.callJsonObject("COEsprit_be.Agent_Chercher", { q: "" });
        		p.then(function (res) {
        			var doc = (res && res.document) ? res.document : (res || {});
        			self.local.agents = self.rowsOf(doc, "Lire_agents");
        			try { self.ref.detectChanges(); } catch (e) {}
        			return null;
        		});
        	}
        	agentCourant() {
        		var id = String(this.agentCode || "");
        		var list = (this.local && this.local.agents) || [];
        		var i = 0;
