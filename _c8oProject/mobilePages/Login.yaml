comment: |
  'Connexion CO''Esprit via COEsprit_be.Auth_Login.
  Choix technique : CallSequenceAction sur Auth_Login (pas de pfAppel) ; LoginComponent n''expose que (Connexion) avec event.input
  {login, password, testRole} — les variables de séquence sont mappées depuis event via UIControlVariable.'
inAutoMenu: false
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	authHorsSI: boolean;
        	roleOptions: any;
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.authHorsSI = false;
        		this.roleOptions = ["MEMBRE", "PILOTE", "ADMIN"];
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		if (!document.getElementById("pfa-fonts")) {
        			var fonts = this.c8o.endpointConvertigo + "/projects/COEsprit_fe/DisplayObjects/mobile/assets/fonts/";
        			var face = function (famille, poids, fichier) {
        				return ''@font-face { font-family: "'' + famille + ''"; font-style: normal; font-weight: '' + poids + ''; font-display: swap; src: url("'' + fonts + fichier + ''") format("woff2"); }'';
        			};
        			var style = document.createElement("style");
        			style.id = "pfa-fonts";
        			style.textContent = face("Montserrat", 700, "montserrat-latin-700-normal.woff2") + face("Roboto", 400, "roboto-latin-400-normal.woff2");
        			document.head.appendChild(style);
        		}
        		if (!document.querySelector("link[data-coe-bundle]")) {
        			var base = this.c8o.endpointConvertigo + "/projects/COEsprit_fe/DisplayObjects/mobile/";
        			var link = document.createElement("link");
        			link.rel = "stylesheet";
        			link.href = base + "assets/css/coe-bundle.css";
        			link.setAttribute("data-coe-bundle", "1");
        			document.head.appendChild(link);
        		}
        /*End_c8o_PageInitialization*/
        /*Begin_c8o_PageFunction*/
        	NavigateRecherche() {
        		return this.routerProvider.navigateRoot("Recherche", false, null);
        	}
        /*End_c8o_PageFunction*/
        '
