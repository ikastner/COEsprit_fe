        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	view: string;
        	pfaUserName: string;
        	pfaUserRole: string;
        	loading: boolean;
        	barrePrete: boolean;
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.view = "recherche";
        		this.pfaUserName = "";
        		this.pfaUserRole = "";
        		try {
        			var g0: any = this.global || {};
        			var c0 = g0.coeIdentite || {};
        			var u0 = g0.user || {};
        			var nom0 = String(c0.nom || u0.displayName || u0.nom || "").trim();
        			var role0 = String(c0.role || "").trim();
        			if (!role0 && u0.role) role0 = Array.isArray(u0.role) ? u0.role.join(", ") : String(u0.role || "");
        			if (nom0) this.pfaUserName = nom0;
        			if (role0) this.pfaUserRole = role0;
        		} catch (eId) {}
        		this.loading = true;
        		this.barrePrete = false;
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
        		/*End_c8o_PageAfterViewInit*/
        /*Begin_c8o_PageFinalization*/
        		/*End_c8o_PageFinalization*/
        /*Begin_c8o_PageFunction*/
        	syncUserFromGlobal() {
        		var u = this.global && this.global.user;
        		if (!u) return;
        		this.pfaUserName = String(u.displayName || u.nom || u.codeAgent || "");
        		var roles = u.role;
        		this.pfaUserRole = Array.isArray(roles) ? roles.join(", ") : String(roles || "");
        	}
        	navSidebar(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		if (code && code.detail != null) code = code.detail;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "recherche") return;
        		if (code === "ma-fiche") this.routerProvider.navigateRoot("MaFiche", false, null);
        		if (code === "profil") this.routerProvider.navigateRoot("Profil", false, null);
        		if (code === "admin") this.routerProvider.navigateRoot("Admin", false, null);
        		if (code === "pilote") this.routerProvider.navigateRoot("Pilote", false, null);
        	}
        	deconnecter() {
        		try { window.sessionStorage.removeItem("coe:userName"); window.sessionStorage.removeItem("coe:userRole"); } catch (e) {}
        		var so = this.routerProvider && this.routerProvider.sharedObject;
        		if (so) { so.user = null; so.coeIdentite = null; so.isConnected = false; }
        		if (this.global) { this.global.user = null; this.global.coeIdentite = null; }
        		this.routerProvider.navigateRoot("Login", false, null);
        	}
        	
        	libelleResultat(row) {
        		if (!row) return "";
        		return String(row.nom_affiche || row.nom || row.displayName || row.user_id || row.cle || "");
        	}
        	countN() {
        		return (this.local.results || []).length;
        	}
        	countSuffix() {
        		var n = this.countN();
        		var s = n > 1 ? "s" : "";
        		return " profil" + s + " trouvé" + s;
        	}
        	valeurSelect(event) {
        		if (event && event.target && event.target.value !== undefined) return event.target.value;
        		if (event && event.detail && event.detail.value !== undefined) return event.detail.value;
        		if (event && event.event && event.event.value !== undefined) return event.event.value;
        		if (event && event.value !== undefined && !event.target) return event.value;
        		return event == null ? "" : event;
        	}
        	siteOpts() {
        		var opts = this.valeursListe("site");
        		if (opts.length) return opts;
        		return [
        			{ value: "Paris", label: "Paris" },
        			{ value: "Lyon", label: "Lyon" },
        			{ value: "Bordeaux", label: "Bordeaux" },
        			{ value: "Toulouse", label: "Toulouse" }
        		];
        	}
        	valeursListe(nom) {
        		var rows = (this.local.listes && this.local.listes.length) ? this.local.listes : (this.global.coeListes || []);
        		return (rows || []).filter(function (r) {
        			return r && String(r.liste) === nom && String(r.valeur || "").trim();
        		}).map(function (r) {
        			return { value: String(r.valeur), label: String(r.valeur) };
        		});
        	}
        	posteOpts() {
        		return this.valeursListe("poste");
        	}
        	entiteOpts() {
        		return this.valeursListe("entite");
        	}
        	communauteLabel() {
        		var rows = this.local.results || [];
        		var f = rows[0] || this.local.fiche || {};
        		return String(f.communaute || "");
        	}
        	termeOpts() {
        		var raw = (this.local.termes && this.local.termes.length) ? this.local.termes : (this.global.coeTermes || []);
        		var all = (raw || []).filter(function (t) {
        			if (!t || typeof t !== "object") return false;
        			if (t.tone != null && t.terme_id == null && t.statut == null) return false;
        			return t.terme_id != null || t.termeId != null || t.statut != null || (t.id != null && t.libelle != null && t.domaine_id != null);
        		});
        		var d = this.local.domaine_id || "";
        		var list = !d ? all : all.filter(function (t) {
        			return String(t.domaine_id || t.domaineId || "") === String(d);
        		});
        		return (list || []).map(function (t) {
        			return { value: String(t.terme_id || t.termeId || t.id || ""), label: String(t.libelle || t.label || t.id || "") };
        		}).filter(function (o) { return o.value; });
        	}
        	besoinOpts() {
        		var raw = (this.local.termes && this.local.termes.length) ? this.local.termes : (this.global.coeTermes || []);
        		var all = (raw || []).filter(function (t) {
        			if (!t || typeof t !== "object") return false;
        			if (t.tone != null && t.terme_id == null && t.statut == null) return false;
        			return t.terme_id != null || t.termeId != null || t.statut != null || (t.id != null && t.libelle != null);
        		});
        		return (all || []).map(function (t) {
        			var lib = String(t.libelle || t.label || t.id || "");
        			var id = String(t.terme_id || t.termeId || t.id || "");
        			return { display: lib, value: id || lib, search: lib + " " + id };
        		}).filter(function (o) { return o.display; }).sort(function (a, b) {
        			return String(a.display).localeCompare(String(b.display), "fr");
        		});
        	}
        	setBesoin(event) {
        		var v = event && event.target ? event.target.value : event;
        		this.local.q = v == null ? "" : String(v);
        	}
        	joinFiltre(v) {
        		var list = [];
        		if (Array.isArray(v)) list = v;
        		else if (v != null && String(v).trim()) list = String(v).split("|");
        		return list.map(function (x) {
        			return String(x == null ? "" : x).split("''").join("").split("|").join("").split(";").join("").trim();
        		}).filter(Boolean).join("|");
        	}
        	valeursMulti(event) {
        		var v = this.valeurSelect(event);
        		if (Array.isArray(v)) return v.map(function (x) { return String(x); }).filter(Boolean);
        		if (v == null || v === "") return [];
        		return [String(v)];
        	}
        	setSite(event) {
        		this.local.site = this.valeursMulti(event);
        	}
        	setPoste(event) {
        		this.local.libelle_poste = this.valeursMulti(event);
        	}
        	setEntite(event) {
        		this.local.entite = this.valeursMulti(event);
        	}
        	setTerme(event) {
        		this.local.terme_id = this.valeursMulti(event);
        	}
        	libelleDomaine(d) {
        		if (!d) return "";
        		return String(d.libelle || d.label || d.nom || "");
        	}
        	domaineChipClass(d) {
        		var tone = (d && d.tone) || "sky";
        		var active = this.local.domaine_id && String(this.local.domaine_id) === String((d && (d.id || d.domaine_id)) || "");
        		return "aide-chip aide-chip--" + tone + (active ? " is-active" : "");
        	}
        	toggleDomaine(d) {
        		var id = d && (d.id || d.domaine_id || d);
        		if (!id) return;
        		this.local.domaine_id = (String(this.local.domaine_id || "") === String(id)) ? "" : String(id);
        		if (this.local.domaine_id && Array.isArray(this.local.terme_id) && this.local.terme_id.length) {
        			var termes = (this.local.termes && this.local.termes.length) ? this.local.termes : (this.global.coeTermes || []);
        			var keep = {};
        			(termes || []).forEach(function (x) {
        				if (String(x.domaine_id || x.domaineId || "") === String(this.local.domaine_id)) {
        					keep[String(x.id || x.terme_id || "")] = true;
        				}
        			}.bind(this));
        			this.local.terme_id = this.local.terme_id.filter(function (id) { return keep[String(id)]; });
        		}
        	}
        	resetFiltres() {
        		this.local.q = "";
        		this.local.recherche = [];
        		this.local.site = [];
        		this.local.libelle_poste = [];
        		this.local.entite = [];
        		this.local.domaine_id = "";
        		this.local.terme_id = [];
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	barreEnChargement() {
        		return !!this.loading && !this.barrePrete;
        	}
        /*End_c8o_PageFunction*/
