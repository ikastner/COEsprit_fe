scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	view: string;
        	pfaUserName: string;
        	pfaUserRole: string;
        	loading: boolean;
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.view = "ma-fiche";
        		this.pfaUserName = "";
        		this.pfaUserRole = "";
        		try {
        			var g0: any = this.global || {};
        			var c0 = g0.coeIdentite || {};
        			var u0 = g0.user || {};
        			var nom0 = String(c0.nom || u0.displayName || u0.nom || "").trim();
        			var role0 = String(c0.role || "").trim();
        			if (!role0 && u0.role) role0 = Array.isArray(u0.role) ? u0.role.join(", ") : String(u0.role || "");
        			if (nom0) this.pfaUserName = nom0;
        			if (role0) this.pfaUserRole = role0;
        		} catch (eId) {}
        		this.loading = true;
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	syncUserFromGlobal() {
        		var u = this.global && this.global.user;
        		if (!u) return;
        		this.pfaUserName = String(u.displayName || u.nom || u.codeAgent || "");
        		var roles = u.role;
        		this.pfaUserRole = Array.isArray(roles) ? roles.join(", ") : String(roles || "");
        	}
        	navSidebar(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "ma-fiche") return;
        		if (code === "recherche") this.routerProvider.navigateRoot("Recherche", false, null);
        		if (code === "profil") this.routerProvider.navigateRoot("Profil", false, null);
        		if (code === "admin") this.routerProvider.navigateRoot("Admin", false, null);
        		if (code === "pilote") this.routerProvider.navigateRoot("Pilote", false, null);
        	}
        	deconnecter() {
        		var so = this.routerProvider && this.routerProvider.sharedObject;
        		if (so) { so.user = null; so.coeIdentite = null; so.isConnected = false; }
        		if (this.global) { this.global.user = null; this.global.coeIdentite = null; }
        		this.routerProvider.navigateRoot("Login", false, null);
        	}
        	communauteLabel() {
        		var f = this.local.fiche || {};
        		return String(f.communaute || "");
        	}
        	payloadFiche() {
        		var f = this.local.fiche || {};
        		return {
        			nom_affiche: f.nom_affiche || f.nom || "",
        			site: f.site || "",
        			perimetre: f.perimetre || "",
        			libelle_poste: f.libelle_poste || f.libellePoste || "",
        			activites_principales: f.activites_principales || f.activitesPrincipales || "",
        			sujets_aide: f.sujets_aide || f.sujetsAide || "",
        			terme_ids: (function () {
        				if (Array.isArray(f.appetences)) return f.appetences.map(function (a) { return a && (a.id || a.terme_id) || ""; }).filter(Boolean).join(",");
        				var ids = f.terme_ids || f.termeIds || "";
        				return Array.isArray(ids) ? ids.join(",") : ids;
        			})(),
        			propositions: (function () {
        				var apps = Array.isArray(f.appetences) ? f.appetences : [];
        				return JSON.stringify(apps.filter(function (a) {
        					return String((a && (a.id || a.terme_id)) || "").indexOf("prop-") === 0;
        				}).map(function (a) {
        					return { libelle: (a && (a.libelle || a.label)) || "", domaine_id: (a && (a.domaine_id || a.domaineId)) || "" };
        				}));
        			})(),
        			photo_url: (function () {
        				var s = String(f.photo_url || f.photoUrl || "").trim();
        				var i = s.indexOf(",");
        				if (s.indexOf("data:") === 0 && i >= 0) s = s.substring(i + 1);
        				return s.replace(/\s/g, "");
        			})()
        		};
        	}
        /*End_c8o_PageFunction*/
        '
